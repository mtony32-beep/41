name: Bangun APK — Gradle 8.7 (Tanpa file .jar manual!)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil semua kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ✅ Download Gradle OTOMATIS — TIDAK PERLU file .jar dari HP!
        run: |
          mkdir -p gradle/wrapper
          # Download gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # Download gradle-wrapper.jar LANGSUNG di server — PASTI LENGKAP ~64KB!
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          # Buat gradlew
          cat > gradlew << 'EOF2'
          #!/bin/sh
          APP_HOME=$( cd "$( dirname "$0" )" && pwd )
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          exec java -Xmx64m -Xms64m -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF2
          chmod +x gradlew
          echo "✅ Gradle siap! File .jar di-download otomatis: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) byte"

      - name: Buat kunci debug
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, OU=Android, O=Android, L=Unknown, S=Unknown, C=US"

      - name: Bangun APK
        run: ./gradlew assembleDebug --no-build-cache

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Recool
          path: app/build/outputs/apk/debug/app-debug.apk
