name: Bangun APK — Gradle 8.7 (Kompatibel)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil semua kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Beri izin gradlew
        run: chmod +x gradlew

      - name: Buat kunci debug
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, OU=Android, O=Android, L=Unknown, S=Unknown, C=US"

      - name: Bangun APK
        run: ./gradlew assembleDebug --no-build-cache

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Recool
          path: app/build/outputs/apk/debug/app-debug.apk
